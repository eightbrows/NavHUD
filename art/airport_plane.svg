<?xml version="1.0" encoding="UTF-8"?>
<!--
  NavHUD 空港の記号のひな形: 塗りつぶしの飛行機（民間の空港。民間（大）は 20dp でまわりに丸い輪、民間（小）は 11dp）
  20261024-D04 に ui/HudCanvas.kt の PLANE_RIGHT_HALF から書き出した（点 18 個。左右対称）。

  枠と向き:
  - viewBox は 0 0 300 300。中心（空港の位置に当たる点）は (150, 150)。
  - 機首は上（y が小さい方）。y は下向きに増える（SVG のふつうの向き）。
  - 翼の端から端まで（幅）が 300（x = 0〜300）で、アプリはこの幅を記号の大きさ（20dp・16dp・11dp）に合わせる。
    機首は y = 0、尾は y = 295 前後（アプリの単位で -1.5〜1.45）。
  - アプリの座標（PLANE_RIGHT_HALF など）との関係: アプリの x = (SVG の x - 150) / 100、アプリの y = (SVG の y - 150) / 100。

  描き方の決まり（自作するとき）: 塗りつぶしのパス 1 本だけ（閉じた輪郭、1 色）。黒のふち・白抜き・民間（大）の輪はアプリが同じ形から作る。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <path fill="#B8FF00" d="M 150 0 L 172 30 L 172 115 L 300 175 L 300 205 L 172 170 L 172 240 L 215 270 L 215 295 L 150 280 L 85 295 L 85 270 L 128 240 L 128 170 L 0 205 L 0 175 L 128 115 L 128 30 Z"/>
</svg>
